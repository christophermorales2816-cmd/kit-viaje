# Aplica las migraciones a la base de producción cuando entran a main.
#
# POR QUÉ EXISTE ESTE WORKFLOW
#
# El CI aplica las migraciones a un Postgres descartable y Vercel deploya
# código, no esquema. Con esos dos solos se puede tener el PR en verde, el
# deploy en producción y la base sin la migración — y la app escribiendo algo
# que la base rechaza. Pasó dos veces en este proyecto, las dos con el mismo
# síntoma: un error que parecía de red y en realidad era una migración sin
# aplicar.
#
# Este workflow cierra ese hueco: mergear a main aplica el esquema.
#
# CONFIGURACIÓN (una vez)
#
# En GitHub → Settings → Secrets and variables → Actions, agregar:
#
#   SUPABASE_ACCESS_TOKEN  Token personal, en supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   El ref del proyecto: el subdominio de la URL de la API
#   SUPABASE_DB_PASSWORD   La contraseña de la base, de Settings → Database
#
# Las tres se cargan en la interfaz de GitHub, nunca en el repo ni en un chat.
# Si falta alguna, el workflow avisa y no intenta nada a medias.
#
# OJO CON DÓNDE SE CARGAN. Tienen que ser *Repository secrets*, en la pestaña
# "Secrets" de esa pantalla. Los tres errores que hacen que el workflow las siga
# viendo vacías son siempre los mismos: cargarlas en la pestaña "Variables" de
# al lado, cargarlas como *Environment secrets* de un environment que este
# workflow no declara, o un typo en el nombre. El paso de verificación imprime
# cuáles faltan, así que el log dice exactamente cuál de las tres es.

name: Migraciones

on:
  push:
    branches: [main]
    paths:
      # Solo cuando cambia el esquema: un PR de UI no tiene por qué tocar la
      # base de producción.
      - "supabase/migrations/**"
      - ".github/workflows/migraciones.yml"
  # Y a mano, para el caso de hoy: la base quedó atrás y hay que alcanzarla
  # sin esperar a la próxima migración.
  workflow_dispatch:

# Nunca dos corridas a la vez contra la misma base, y sin cancelar la que ya
# empezó: interrumpir un `db push` a la mitad es peor que esperar.
concurrency:
  group: migraciones-produccion
  cancel-in-progress: false

jobs:
  push:
    name: Aplicar a producción
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Verificar que estén los tres secrets
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          faltan=""
          [ -n "$TOKEN" ]    || faltan="$faltan SUPABASE_ACCESS_TOKEN"
          [ -n "$REF" ]      || faltan="$faltan SUPABASE_PROJECT_REF"
          [ -n "$PASSWORD" ] || faltan="$faltan SUPABASE_DB_PASSWORD"

          if [ -n "$faltan" ]; then
            echo "Faltan estos secrets:$faltan"
            echo
            echo "Van como TRES secrets separados, cada uno con ese nombre"
            echo "exacto, en Settings -> Secrets and variables -> Actions,"
            echo "pestaña Secrets, botón 'New repository secret'."
            echo
            echo "No es un solo secret que contenga los tres nombres adentro:"
            echo "el workflow busca cada nombre por separado."
            echo
            echo "Sin ellos no se puede aplicar nada, así que esto falla acá"
            echo "en vez de dejar la base a medias."
            exit 1
          fi

          # Chequeo de FORMA, no de validez. No prueba que las credenciales
          # sirvan —eso lo dirá el link— pero caza el error más común de
          # configuración: pegar en el valor la DESCRIPCIÓN de dónde sacarlo en
          # vez del valor. Sin esto, ese error aparece recién en `supabase link`
          # como un mensaje de red que no se parece en nada a su causa.
          malos=""

          case "$REF" in
            *[!a-z0-9]*|"") malos="$malos SUPABASE_PROJECT_REF" ;;
          esac

          case "$TOKEN" in
            sbp_*) ;;
            *) malos="$malos SUPABASE_ACCESS_TOKEN" ;;
          esac

          if [ -n "$malos" ]; then
            echo "Estos secrets están cargados pero no tienen la forma esperada:$malos"
            echo
            echo "SUPABASE_PROJECT_REF es solo el ref del proyecto: una tirada"
            echo "de letras minúsculas y números, sin https, sin puntos y sin"
            echo "'.supabase.co'. Está en la URL del dashboard, después de"
            echo "/project/, y es el subdominio de tu URL de API."
            echo
            echo "SUPABASE_ACCESS_TOKEN empieza con sbp_ y se genera en"
            echo "supabase.com/dashboard/account/tokens."
            echo
            echo "No se imprime ningún valor acá a propósito."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Enlazar el proyecto
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      # Primero se muestra qué va a correr. Si algo sale mal, el log dice
      # exactamente qué migración estaba aplicando.
      - name: Ver qué falta aplicar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked

      - name: Aplicar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked

      # Deja constancia de cómo quedó: sin esto, saber si la base está al día
      # obliga a entrar al dashboard.
      - name: Confirmar que quedó al día
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked
