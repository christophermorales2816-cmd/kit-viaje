# Actualizaciones de dependencias (auditoría de seguridad).
#
# Next.js estuvo en producción con una vulnerabilidad crítica publicada porque
# nadie avisaba que había un parche. Con esto, GitHub abre un PR cuando sale
# una versión nueva: el CI lo prueba y se mergea si está en verde.
#
# Las actions de los workflows van fijadas por commit (SHA) para que nadie
# pueda cambiar lo que corre con las llaves de producción; Dependabot es el que
# mantiene esos SHA al día.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Los parches y menores juntos en un solo PR: son muchos y casi nunca
      # rompen nada. Los mayores, cada uno por su lado, para revisarlos.
      menores:
        update-types: [minor, patch]
    ignore:
      # Estos dos se suben junto con Next.js, no por su cuenta. eslint-config-next
      # 16 no soporta ESLint 10 (eslint-plugin-react se cae al recorrer el
      # código) ni TypeScript 7 (typescript-eslint no carga). Los dos PRs se
      # mergearon en rojo el 2026-10-09 y main quedó sin lint. Cuando Next los
      # soporte, se suben a mano en un PR y se saca la regla.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
